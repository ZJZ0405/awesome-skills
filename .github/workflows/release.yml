name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Version matches tag
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

      - name: Validate
        run: |
          python3 scripts/validate.py --strict
          python3 scripts/catalog.py --check
          PYTHONPATH=installer/src python3 -m unittest discover -s installer/tests

      - name: Build offline bundle
        run: sh scripts/pack.sh --zip

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes

      - name: Notify blog to refresh the download card
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.BLOG_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::BLOG_DISPATCH_TOKEN is not set; skipping the blog sync"
            exit 0
          fi
          gh api --method POST \
            repos/ZJZ0405/zjz0405.github.io/dispatches \
            -f event_type=awesome-skills-updated
